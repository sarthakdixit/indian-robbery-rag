name: frontend-deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "staticwebapp.config.json"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/**"
      - "staticwebapp.config.json"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

# SWA uses a deployment token rather than OIDC. The token is scoped to
# this one SWA resource; it can deploy but cannot read or modify anything
# else in Azure. Stored as the AZURE_STATIC_WEB_APPS_API_TOKEN secret.
#
# Two-phase build: we install + build on the GitHub Actions runner
# (which has pnpm available), then SWA's deploy action uploads the
# pre-built dist/ folder. Skipping SWA's Oryx-based build avoids
# Oryx's lack of pnpm support.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Check whether deploy is ready
        id: deploy_ready
        run: |
          missing=""
          if [ ! -f "frontend/package.json" ]; then missing="${missing}frontend/package.json, "; fi
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then missing="${missing}AZURE_STATIC_WEB_APPS_API_TOKEN secret, "; fi

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped. Missing prerequisites: ${missing%, }"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.deploy_ready.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: steps.deploy_ready.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies and build
        if: steps.deploy_ready.outputs.ready == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL || 'https://example.invalid' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          VITE_ENVIRONMENT: cloud
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to Azure Static Web Apps
        if: steps.deploy_ready.outputs.ready == 'true'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
