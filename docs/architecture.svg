<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Indian robbery law RAG system architecture</title>
<desc>A layered diagram showing the request flow from the user browser through Azure Static Web Apps to the FastAPI backend on Container Apps, which in turn calls Cosmos DB, an embedded ChromaDB index, the Gemini API, Cloudflare Turnstile, Azure Key Vault, and Application Insights.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke-width: 1.5; fill: none; }

  /* Light mode (default) */
  .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue   text { fill: #0C447C; }
  .c-blue   .ts { fill: #185FA5; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal   text { fill: #085041; }
  .c-teal   .ts { fill: #0F6E56; }
  .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral  text { fill: #712B13; }
  .c-coral  .ts { fill: #993C1D; }
  .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray   text { fill: #444441; }
  .c-gray   .ts { fill: #5F5E5A; }
  .arr      { stroke: #5F5E5A; }
  .leader   { stroke: #888780; stroke-dasharray: 3 3; }
  .legend-text { fill: #444441; }

  @media (prefers-color-scheme: dark) {
    .c-blue   rect { fill: #0C447C; stroke: #B5D4F4; }
    .c-blue   text { fill: #E6F1FB; }
    .c-blue   .ts { fill: #B5D4F4; }
    .c-purple rect { fill: #3C3489; stroke: #CECBF6; }
    .c-purple text { fill: #EEEDFE; }
    .c-purple .ts { fill: #CECBF6; }
    .c-teal   rect { fill: #085041; stroke: #9FE1CB; }
    .c-teal   text { fill: #E1F5EE; }
    .c-teal   .ts { fill: #9FE1CB; }
    .c-coral  rect { fill: #712B13; stroke: #F5C4B3; }
    .c-coral  text { fill: #FAECE7; }
    .c-coral  .ts { fill: #F5C4B3; }
    .c-gray   rect { fill: #444441; stroke: #D3D1C7; }
    .c-gray   text { fill: #F1EFE8; }
    .c-gray   .ts { fill: #D3D1C7; }
    .arr      { stroke: #D3D1C7; }
    .leader   { stroke: #888780; }
    .legend-text { fill: #D3D1C7; }
  }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-gray">
<rect x="270" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">User browser</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">Submits question</text>
</g>

<line x1="340" y1="64" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="240" y="92" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">Azure Static Web Apps</text>
<text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">React + Vite, Free tier</text>
</g>

<line x1="340" y1="148" x2="340" y2="176" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="370" y="166" text-anchor="start">/api/* proxied</text>

<g class="c-purple">
<rect x="220" y="176" width="240" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="200" text-anchor="middle" dominant-baseline="central">Azure Container Apps</text>
<text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">FastAPI backend</text>
<text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central">Scale-to-zero, GHCR image</text>
</g>

<line x1="80" y1="320" x2="220" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="320" x2="280" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="320" x2="400" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="320" x2="460" y2="232" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="20" y="320" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="338" text-anchor="middle" dominant-baseline="central">Cosmos DB</text>
<text class="ts" x="80" y="356" text-anchor="middle" dominant-baseline="central">Rate limits, cache</text>
</g>

<g class="c-teal">
<rect x="180" y="320" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="260" y="338" text-anchor="middle" dominant-baseline="central">ChromaDB embedded</text>
<text class="ts" x="260" y="356" text-anchor="middle" dominant-baseline="central">Vector index + BM25</text>
</g>

<g class="c-coral">
<rect x="360" y="320" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="338" text-anchor="middle" dominant-baseline="central">Gemini API</text>
<text class="ts" x="420" y="356" text-anchor="middle" dominant-baseline="central">Embed + generate</text>
</g>

<g class="c-coral">
<rect x="540" y="320" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="600" y="338" text-anchor="middle" dominant-baseline="central">Turnstile</text>
<text class="ts" x="600" y="356" text-anchor="middle" dominant-baseline="central">Bot verification</text>
</g>

<line x1="200" y1="408" x2="280" y2="252" class="leader" stroke-width="0.5" fill="none"/>
<line x1="480" y1="408" x2="400" y2="252" class="leader" stroke-width="0.5" fill="none"/>

<g class="c-gray">
<rect x="120" y="408" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="426" text-anchor="middle" dominant-baseline="central">Azure Key Vault</text>
<text class="ts" x="200" y="444" text-anchor="middle" dominant-baseline="central">Secrets via managed ID</text>
</g>

<g class="c-gray">
<rect x="400" y="408" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="426" text-anchor="middle" dominant-baseline="central">App Insights</text>
<text class="ts" x="480" y="444" text-anchor="middle" dominant-baseline="central">Structured logs</text>
</g>

<g class="c-blue"><rect x="20" y="500" width="14" height="14" rx="2" stroke-width="0.5"/></g>
<text class="ts legend-text" x="42" y="511" dominant-baseline="central">Frontend hosting</text>

<g class="c-purple"><rect x="160" y="500" width="14" height="14" rx="2" stroke-width="0.5"/></g>
<text class="ts legend-text" x="182" y="511" dominant-baseline="central">Compute</text>

<g class="c-teal"><rect x="260" y="500" width="14" height="14" rx="2" stroke-width="0.5"/></g>
<text class="ts legend-text" x="282" y="511" dominant-baseline="central">Data stores</text>

<g class="c-coral"><rect x="380" y="500" width="14" height="14" rx="2" stroke-width="0.5"/></g>
<text class="ts legend-text" x="402" y="511" dominant-baseline="central">External APIs</text>

<g class="c-gray"><rect x="500" y="500" width="14" height="14" rx="2" stroke-width="0.5"/></g>
<text class="ts legend-text" x="522" y="511" dominant-baseline="central">Platform services</text>

<line x1="20" y1="540" x2="60" y2="540" class="arr" marker-end="url(#arrow)"/>
<text class="ts legend-text" x="68" y="540" dominant-baseline="central">Request path</text>

<line x1="200" y1="540" x2="240" y2="540" class="leader" stroke-width="0.5" fill="none"/>
<text class="ts legend-text" x="248" y="540" dominant-baseline="central">Platform integration (managed identity, telemetry sink)</text>
</svg>
